[project]
name = "thu-ta-auto-grader"
version = "0.1.0"
description = "THU teaching assistant automation: learn.tsinghua download, Yuketang grading, score upload"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.15.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "pdf2docx>=0.5.13",
    "openpyxl>=3.1.5",
]

[project.scripts]
thu-ta = "main:main"
